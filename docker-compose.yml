# Demo stack. Everything runs on SQLite and local media (spec §19); for a
# production deployment point DATABASE_URL at managed PostgreSQL and move media
# to R2/S3.
services:
  django:
    build: ./backend-django
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,django"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
      CSRF_TRUSTED_ORIGINS: "http://localhost:3000"
    volumes:
      - django-data:/app/data
      - ./backend-django/media:/app/media

  fastapi:
    build: ./backend-fastapi
    ports:
      - "8001:8001"
    environment:
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_DJANGO_API_URL: "http://localhost:8000/api"
        NEXT_PUBLIC_FASTAPI_URL: "http://localhost:8001"
        NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
    ports:
      - "3000:3000"
    depends_on:
      - django
      - fastapi

volumes:
  django-data:
